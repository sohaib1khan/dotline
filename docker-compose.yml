services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dotline}
      POSTGRES_USER: ${POSTGRES_USER:-dotline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dotline} -d ${POSTGRES_DB:-dotline}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports published — reachable only on the Compose network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    ports:
      - "${DOTLINE_PORT:-47391}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:47391}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SECRET_KEY: ${SECRET_KEY:-change_me_long_random_string}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-change_me_fernet_key}
      CONTENT_DATA_DIR: /app/data/content
      POSTGRES_DB: ${POSTGRES_DB:-dotline}
      POSTGRES_USER: ${POSTGRES_USER:-dotline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  app_data:
