order: 5
title: Capitals
description: Capital indicator (dot 6) before a letter.
lessons:
  - order: 1
    title: "Meet the capital sign"
    type: learn
    xp_reward: 15
    content:
      instruction: "A capital letter starts with the capital indicator (dot 6), then the letter."
      items:
        - id: cap
          label: "Capital sign"
          speak: "Capital indicator, only dot 6"
          dots: [6]
          show_cell: true
        - id: A
          label: "A"
          speak: "Capital A. First type the capital sign, then a."
          letter: "A"
          cells: [[6], [1]]
          dots: [6]
          show_cell: true
          note: "Practice the capital indicator now; full two-cell capitals come next."
  - order: 2
    title: "Write capitals"
    type: write
    xp_reward: 20
    content:
      instruction: "Type the capital indicator (dot 6) when asked, or the letter chord."
      items:
        - { id: w1, label: "Capital sign", speak: "Capital indicator", dots: [6], show_cell: false }
        - { id: w2, label: "a", speak: "letter a after a capital", letter: "a", dots: [1], show_cell: false }
        - { id: w3, label: "Capital sign", speak: "Capital indicator", dots: [6], show_cell: false }
        - { id: w4, label: "b", speak: "letter b after a capital", letter: "b", dots: [1, 2], show_cell: false }
        - { id: w5, label: "Capital sign", speak: "Capital indicator", dots: [6], show_cell: false }
        - { id: w6, label: "t", speak: "letter t after a capital", letter: "t", dots: [2, 3, 4, 5], show_cell: false }
  - order: 3
    title: "Read capitals"
    type: read
    xp_reward: 20
    content:
      instruction: "Is this the capital indicator or a letter?"
      items:
        - { id: r1, label: "Capital", speak: "What is this cell?", dots: [6], show_cell: true, choices: ["Capital sign", "Dot 3", "Letter a", "Number sign"], answer: "Capital sign" }
        - { id: r2, label: "a", speak: "What letter follows a capital sign here?", letter: "a", dots: [1], show_cell: true, choices: ["a", "b", "k", "u"], answer: "a" }
        - { id: r3, label: "Capital", speak: "What is this cell?", dots: [6], show_cell: true, choices: ["w", "Capital sign", "Comma", "Dot 4"], answer: "Capital sign" }
  - order: 4
    title: "Unit 5 review"
    type: review
    xp_reward: 30
    content:
      instruction: "Capital indicator practice. Need 80% to pass."
      pass_score: 80
      items:
        - { id: rv1, kind: write, label: "Capital sign", speak: "Capital indicator", dots: [6], show_cell: false }
        - { id: rv2, kind: read, label: "Capital", speak: "What is this?", dots: [6], show_cell: true, choices: ["Capital sign", "Number sign", "Period", "w"], answer: "Capital sign" }
        - { id: rv3, kind: write, label: "m", speak: "letter m", letter: "m", dots: [1, 3, 4], show_cell: false }
        - { id: rv4, kind: write, label: "Capital sign", speak: "Capital indicator", dots: [6], show_cell: false }
        - { id: rv5, kind: read, label: "c", speak: "Which letter?", letter: "c", dots: [1, 4], show_cell: true, choices: ["a", "c", "e", "i"], answer: "c" }
