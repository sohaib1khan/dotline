order: 9
title: Short stories
description: Read and write letters from tiny Grade 1 stories. Edit this file (or the course pack) to add more.
lessons:
  - order: 1
    title: "Story — Sam sat"
    type: story
    xp_reward: 30
    content:
      instruction: "Read the story, then write each letter."
      passage: "Sam sat. Sam sat at a mat."
      passage_speak: "Sam sat. Sam sat at a mat."
      items:
        - { id: s1, kind: write, label: "S", speak: "Capital S", letter: "s", dots: [2, 3, 4], show_cell: false, note: "Capital sign + s" }
        - { id: a1, kind: write, label: "a", speak: "a", letter: "a", dots: [1], show_cell: false }
        - { id: m1, kind: write, label: "m", speak: "m", letter: "m", dots: [1, 3, 4], show_cell: false }
        - { id: s2, kind: write, label: "s", speak: "s", letter: "s", dots: [2, 3, 4], show_cell: false }
        - { id: a2, kind: write, label: "a", speak: "a", letter: "a", dots: [1], show_cell: false }
        - { id: t1, kind: write, label: "t", speak: "t", letter: "t", dots: [2, 3, 4, 5], show_cell: false }
  - order: 2
    title: "Story — read Sam"
    type: story
    xp_reward: 30
    content:
      instruction: "Look at the cell. Which letter fits the story?"
      passage: "Sam sat. Sam sat at a mat."
      passage_speak: "Sam sat. Sam sat at a mat."
      items:
        - { id: r1, kind: read, label: "S", speak: "First letter of Sam?", letter: "s", dots: [2, 3, 4], show_cell: true, choices: ["s", "m", "a", "t"], answer: "s" }
        - { id: r2, kind: read, label: "a", speak: "Middle letter of Sam?", letter: "a", dots: [1], show_cell: true, choices: ["o", "a", "e", "i"], answer: "a" }
        - { id: r3, kind: read, label: "m", speak: "Last letter of Sam?", letter: "m", dots: [1, 3, 4], show_cell: true, choices: ["n", "m", "r", "w"], answer: "m" }
        - { id: r4, kind: read, label: "t", speak: "Last letter of sat?", letter: "t", dots: [2, 3, 4, 5], show_cell: true, choices: ["d", "t", "l", "k"], answer: "t" }
  - order: 3
    title: "Story — A big dog"
    type: story
    xp_reward: 35
    content:
      instruction: "Write the letters that build this story."
      passage: "A big dog digs. The dog digs in the mud."
      passage_speak: "A big dog digs. The dog digs in the mud."
      items:
        - { id: b1, kind: write, label: "b", speak: "b in big", letter: "b", dots: [1, 2], show_cell: false }
        - { id: i1, kind: write, label: "i", speak: "i in big", letter: "i", dots: [2, 4], show_cell: false }
        - { id: g1, kind: write, label: "g", speak: "g in big", letter: "g", dots: [1, 2, 4, 5], show_cell: false }
        - { id: d1, kind: write, label: "d", speak: "d in dog", letter: "d", dots: [1, 4, 5], show_cell: false }
        - { id: o1, kind: write, label: "o", speak: "o in dog", letter: "o", dots: [1, 3, 5], show_cell: false }
        - { id: g2, kind: write, label: "g", speak: "g in dog", letter: "g", dots: [1, 2, 4, 5], show_cell: false }
  - order: 4
    title: "Stories review"
    type: review
    xp_reward: 40
    content:
      instruction: "Letters from the short stories. Need 80% to pass."
      pass_score: 80
      passage: "Sam sat. A big dog digs."
      items:
        - { id: rv1, kind: write, label: "s", speak: "s", letter: "s", dots: [2, 3, 4], show_cell: false }
        - { id: rv2, kind: write, label: "a", speak: "a", letter: "a", dots: [1], show_cell: false }
        - { id: rv3, kind: write, label: "m", speak: "m", letter: "m", dots: [1, 3, 4], show_cell: false }
        - { id: rv4, kind: read, label: "d", speak: "First letter of dog?", letter: "d", dots: [1, 4, 5], show_cell: true, choices: ["b", "d", "g", "p"], answer: "d" }
        - { id: rv5, kind: write, label: "g", speak: "g", letter: "g", dots: [1, 2, 4, 5], show_cell: false }
